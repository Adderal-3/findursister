    <script type="text/javascript">
      (function () {
        function safeString(value, maxLength) {
          var text = value === undefined || value === null ? '' : String(value);
          return text.length > maxLength ? text.slice(0, maxLength) : text;
        }
        function sendToNs(payload) {
          try {
            if (typeof window.ns === 'function') {
              window.ns('send', payload);
              return;
            }
          } catch (_) { /* 上报失败不影响游戏 */ }
        }
        function getMinigameId(url) {
          try {
            var pathname = url ? new URL(url).pathname : window.location.pathname;
            var match = pathname.match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i);
            return match ? match[0] : 'find-sister';
          } catch (_) {
            return 'find-sister';
          }
        }
        function errorPayload(kind, data) {
          return {
            hitType: 'event',
            eventCategory: kind,
            eventAction: 'fe_' + getMinigameId(window.location.href),
            eventLabel: JSON.stringify(data),
          };
        }
        window.addEventListener('error', function (event) {
          sendToNs(errorPayload('fe_mini_game_error', {
            kind: 'error',
            message: safeString(event && event.message, 500),
            filename: safeString(event && event.filename, 300),
            lineno: event && event.lineno,
            colno: event && event.colno,
            stack: safeString(event && event.error && event.error.stack, 1200),
          }));
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event && event.reason;
          sendToNs(errorPayload('fe_mini_game_error', {
            kind: 'unhandledrejection',
            message: safeString(reason && reason.message ? reason.message : reason, 800),
            stack: safeString(reason && reason.stack, 1200),
          }));
        });
      })();
    </script>

    <script type="text/javascript">

        var script = document.createElement('script');

        script.src = 'https://g.166.net/pkg/ds-ulink2/latest/ds-ulink2.min.js';
        script.crossOrigin = 'anonymous';
        script.onload = function () {
          callbacks.forEach(function (callback) { callback(null); });
          callbacks = [];
        };
        script.onerror = function (error) { loadError = error; callbacks = []; };
        window.onDsUlinkReady = function (callback) {
          if (window.DsUlink) callback(null);
          else if (loadError) callback(loadError);
          else callbacks.push(callback);
        };
        document.head.appendChild(script);
      })();
    </script>

          script.crossOrigin = 'anonymous';
          document.head.appendChild(script);
          var callbackQueue = [], errorEvent = null;
          script.onload = function () {
            for (var i = 0; i < callbackQueue.length; i++) callbackQueue[i](null);
            callbackQueue = [];
          };
          script.onerror = function (event) { errorEvent = event; callbackQueue = []; };
          window.onMobileShareReady = function (callback) {
            if (typeof callback !== 'function') callback = function () {};
            if (window.MobileShare) callback(null);
            else if (errorEvent) callback(errorEvent);
            else callbackQueue.push(callback);
          };
        }
      })();
