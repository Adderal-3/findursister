<script type="text/javascript">
(function() {
  function safeString(v, maxLen) {
    var s = v === undefined || v === null ? '' : String(v);
    return s.length > maxLen ? s.slice(0, maxLen) : s;
  }
  function sendToNs(payload) {
    try { if (typeof window.ns === 'function') { window.ns('send', payload); return true; } } catch(_) {}
    return false;
  }
  function getMinigameId(url) {
    try {
      const pathname = url ? new URL(url, 'http://localhost').pathname : location.pathname;
      const match = pathname.match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i);
      return match ? match[0] : null;
    } catch (e) {
      return null;
    }
  }
  function buildErrorPayload(kind, data) {
    // var href = ''; try { href = safeString(location.href, 400); } catch(_) {}

      hitType: 'event',
      eventCategory: kind,
      eventAction: "fe_" + getMinigameId(location.href),
      eventLabel: JSON.stringify(data),
    }
    // return { kind: kind, href: href, ua: safeString(navigator && navigator.userAgent, 300), ts: Date.now(), data: data || {} };
  }
  window.addEventListener('error', function(e) {
    sendToNs(buildErrorPayload('fe_mini_game_error', {
      kind: "error",

      lineno: e && e.lineno, colno: e && e.colno, stack: safeString(e && e.error && e.error.stack, 1200)
    }));
  }, true);

      kind: "unhandledrejection",
      message: safeString(reason && reason.message ? reason.message : reason, 800),
      stack: safeString(reason && reason.stack, 1200)
    }));
  });
})();
